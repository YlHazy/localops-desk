name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: localops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:delivery
      - run: npm test
      - run: npm run build
      - if: matrix.node == 24
        run: npm run package:portable
      - if: matrix.node == 24
        run: npm run verify:portable
      - if: matrix.node == 24
        run: npm run package:desktop
      - if: matrix.node == 24
        run: npm run verify:desktop
      - if: matrix.node == 24
        run: node artifacts/localops-guardian-windows-portable/scripts/launch-pet.mjs --check
      - if: matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localops-guardian-windows-portable
          path: artifacts/localops-guardian-windows-portable
          if-no-files-found: error
          retention-days: 14
      - if: matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localops-guardian-windows-desktop
          path: release/LocalOps-Guardian-0.1.0-x64.exe
          if-no-files-found: error
          retention-days: 14
