openapi: 3.1.0
info:
  title: LocalOps Desk Local API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:4317
paths:
  /api/pet-presence/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read one ephemeral desktop-pet presence session
      responses:
        "200":
          description: Presence and last-seen time only
        "400":
          description: Invalid UUID session
    put:
      summary: Record open or closing state for one ephemeral pet session
      responses:
        "200":
          description: Updated memory-only presence
        "400":
          description: Invalid UUID or state
  /api/status:
    get:
      summary: Get latest dashboard status
      responses:
        "200":
          description: Current status summary
  /api/hosts:
    get:
      summary: List configured hosts
      responses:
        "200":
          description: Host list
    post:
      summary: Create a local host configuration
      responses:
        "201":
          description: Created host
  /api/hosts/{id}:
    put:
      summary: Update a local host configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated host
    delete:
      summary: Delete a local host configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion result
  /api/practice/offline:
    post:
      summary: Explicitly install the exclusive zero-network practice profile
      responses:
        "201":
          description: Installed or already-present managed practice profile
        "409":
          description: Existing or colliding host data was preserved
    delete:
      summary: Remove only exact managed practice data and orphaned practice runs
      responses:
        "200":
          description: Practice cleanup result
        "409":
          description: Colliding or modified data was preserved
  /api/checks:
    get:
      summary: List recent check runs
      responses:
        "200":
          description: Recent check runs
  /api/checks/light:
    post:
      summary: Run light checks
      responses:
        "200":
          description: Light check result
  /api/checks/light/{hostId}:
    post:
      summary: Run a light check for one host
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host-scoped light check result
  /api/checks/deep:
    post:
      summary: Preview or run deep checks
      responses:
        "200":
          description: Deep check result or dry-run plan
  /api/scheduler:
    get:
      summary: Get local scheduler state
      responses:
        "200":
          description: Scheduler state
    put:
      summary: Configure local scheduler state
      responses:
        "200":
          description: Updated scheduler state
  /api/startup:
    get:
      summary: Get public LocalOps current-user login-start state
      responses:
        "200":
          description: Startup support, readiness, enablement, conflict, and blocker state without local paths
    put:
      summary: Explicitly enable or disable the owned current-user login-start entry
      responses:
        "200":
          description: Updated public startup state
        "400":
          description: Unsupported platform or invalid enabled value
        "409":
          description: Missing readiness prerequisite or conflicting same-name entry
  /api/maintenance/retention:
    post:
      summary: Apply local SQLite retention cleanup
      responses:
        "200":
          description: Retention cleanup result
  /api/actions/dry-run:
    post:
      summary: Generate a safe action plan
      responses:
        "200":
          description: Dry-run action plan
  /api/reports/current:
    get:
      summary: Get current diagnostic report
      responses:
        "200":
          description: Diagnostic report
  /api/agent/manifest:
    get:
      summary: Get local agent API manifest
      responses:
        "200":
          description: Local agent API manifest
  /api/agent/status:
    get:
      summary: Get agent-friendly status payload
      responses:
        "200":
          description: Status, recent checks, and diagnostic report
